[package]
name = "spectral-tally"
version = "0.1.0"
description = "Spectral Tally desktop app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
win32job = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
